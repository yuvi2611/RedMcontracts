<div class="page-padding animate-in">
  <div class="page-header">
    <div>
      <h1 class="page-title">Audit Log</h1>
      <p class="page-subtitle">Trace contract, user, template, and approval activity.</p>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn-secondary" onclick="showToast('Downloading audit log CSV…','success')" type="button">Download CSV</button>
    </div>
  </div>

  <!-- Search & Filter -->
  <div class="list-toolbar animate-in animate-delay-1">
    <div class="search-wrap">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" type="text" placeholder="Search by actor, action, or entity…">
    </div>
    <div class="filter-tabs" id="auditTabs">
      <button class="filter-tab active" onclick="setAuditTab(this,'all')">All</button>
      <button class="filter-tab" onclick="setAuditTab(this,'contract')">Contracts</button>
      <button class="filter-tab" onclick="setAuditTab(this,'approval')">Approvals</button>
      <button class="filter-tab" onclick="setAuditTab(this,'auth')">Auth</button>
      <button class="filter-tab" onclick="setAuditTab(this,'system')">System</button>
    </div>
  </div>

  <!-- Timeline — populated by initAuditLog() -->
  <div class="audit-timeline animate-in animate-delay-2" id="auditTimeline">
  </div>

  <div style="text-align:center;padding:24px 0;">
    <button class="btn-secondary" onclick="showToast('Loading older entries…','info')">Load older entries</button>
  </div>
</div>
