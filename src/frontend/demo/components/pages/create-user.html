<div class="page-padding animate-in">
  <div class="page-header">
    <div>
      <h1 class="page-title">Create User</h1>
      <p class="page-subtitle">Provision a new ContractIQ account. Only superusers can create accounts.</p>
    </div>
    <button class="btn-secondary" onclick="routeTo('settings')" type="button">← Back to Settings</button>
  </div>

  <!-- Access guard — shown when non-superuser lands here -->
  <div id="cuSuperuserGuard" class="hidden" style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:12px;background:rgba(212,0,42,.07);border:1px solid rgba(212,0,42,.2);color:var(--red-700);font-size:13.5px;font-weight:500;margin-bottom:24px;">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Only a superuser can create accounts. You do not have access to this page.
  </div>

  <!-- Success panel -->
  <div id="cuSuccessPanel" class="hidden" style="background:white;border:1px solid rgba(16,185,129,.25);border-radius:16px;padding:52px 40px;text-align:center;max-width:520px;margin:0 auto;">
    <div style="width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,.12);color:var(--success);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">✓</div>
    <div style="font-size:22px;font-weight:800;color:var(--coal-900);margin-bottom:8px;">User Created</div>
    <div style="font-size:13.5px;color:var(--coal-500);margin-bottom:16px;" id="cuSuccessSub">Account provisioned successfully.</div>
    <div style="background:var(--coal-50);border-radius:10px;padding:14px 18px;font-size:13px;color:var(--coal-700);text-align:left;margin-bottom:24px;line-height:1.7;" id="cuSuccessDetail"></div>
    <div style="display:flex;justify-content:center;gap:12px;">
      <button class="btn-primary" onclick="cuAcknowledgeCreatedUser()">Okay</button>
      <button class="btn-secondary" onclick="cuCreateAnother()">Create Another</button>
    </div>
  </div>

  <!--
    Two-column wrapper: form (left) + info panel (right).
    The aside is built and injected by initCreateUser() in app.js
    to guarantee the correct layout regardless of browser caching.
  -->
  <div id="cuFormWrap">
    <form id="createUserForm" class="cu-form-wrap" autocomplete="off" novalidate>

      <!-- PERSONAL DETAILS ──────────────────── -->
      <div class="cu-section">
        <div class="cu-section-title">Personal Details</div>

        <div class="cu-row-2">
          <div class="cu-field">
            <label class="cu-label" for="cuFirstName">First Name <span class="cu-star">*</span></label>
            <input class="cu-input" id="cuFirstName" type="text" placeholder="e.g. Nomsa" autocomplete="off" required>
            <span class="cu-err" id="cuFirstNameErr"></span>
          </div>
          <div class="cu-field">
            <label class="cu-label" for="cuLastName">Last Name <span class="cu-star">*</span></label>
            <input class="cu-input" id="cuLastName" type="text" placeholder="e.g. Mahlangu" autocomplete="off" required>
            <span class="cu-err" id="cuLastNameErr"></span>
          </div>
        </div>

        <div class="cu-field">
          <label class="cu-label" for="cuEmail">Email Address <span class="cu-star">*</span></label>
          <div class="cu-input-wrap">
            <svg class="cu-ico" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input class="cu-input cu-pl" id="cuEmail" type="email" placeholder="user@redmps.com" autocomplete="off" required>
          </div>
          <span class="cu-err" id="cuEmailErr"></span>
        </div>

        <div class="cu-field">
          <label class="cu-label" for="cuPhone">Phone <span class="cu-opt">(optional)</span></label>
          <div class="cu-input-wrap">
            <svg class="cu-ico" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 11.82 19a19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 3.08 4.18 2 2 0 0 1 5.07 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L9.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <input class="cu-input cu-pl" id="cuPhone" type="tel" placeholder="+27 82 000 0000" autocomplete="off">
          </div>
        </div>

        <div class="cu-row-2">
          <div class="cu-field">
            <label class="cu-label" for="cuRole">Role <span class="cu-star">*</span></label>
            <select class="cu-select" id="cuRole" required>
              <option value="">Select a role…</option>
              <option value="hr_officer">HR Officer</option>
              <option value="hr_manager">HR Manager</option>
              <option value="director">Director</option>
              <option value="administrator">Administrator</option>
            </select>
            <span class="cu-err" id="cuRoleErr"></span>
          </div>
          <div class="cu-field">
            <label class="cu-label" for="cuDept">Department <span class="cu-opt">(optional)</span></label>
            <select class="cu-select" id="cuDept">
              <option value="">None</option>
              <option value="hr">Human Resources</option>
              <option value="finance">Finance</option>
              <option value="operations">Operations</option>
              <option value="it">Information Technology</option>
              <option value="legal">Legal &amp; Compliance</option>
              <option value="executive">Executive</option>
            </select>
          </div>
        </div>
      </div>

      <!-- CREDENTIALS ───────────────────────── -->
      <div class="cu-section">
        <div class="cu-section-title">Credentials</div>

        <div class="cu-field">
          <label class="cu-label" for="cuPassword">Temporary Password <span class="cu-star">*</span></label>
          <div class="cu-input-wrap">
            <svg class="cu-ico" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="cu-input cu-pl cu-pr" id="cuPassword" type="password" placeholder="Min. 12 characters" autocomplete="new-password" required oninput="cuCheckStrength(this.value)">
            <button class="cu-eye" type="button" onclick="cuTogglePw('cuPassword',this)" aria-label="Toggle password visibility">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="cu-strength">
            <div class="cu-bars">
              <span class="cu-sbar" id="cuSbar1"></span>
              <span class="cu-sbar" id="cuSbar2"></span>
              <span class="cu-sbar" id="cuSbar3"></span>
              <span class="cu-sbar" id="cuSbar4"></span>
            </div>
            <span class="cu-strength-label" id="cuStrengthLabel">Enter a password</span>
          </div>
          <span class="cu-err" id="cuPasswordErr"></span>
        </div>

        <div class="cu-field">
          <label class="cu-label" for="cuConfirm">Confirm Password <span class="cu-star">*</span></label>
          <div class="cu-input-wrap">
            <svg class="cu-ico" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="cu-input cu-pl cu-pr" id="cuConfirm" type="password" placeholder="Repeat password" autocomplete="new-password" required>
            <button class="cu-eye" type="button" onclick="cuTogglePw('cuConfirm',this)" aria-label="Toggle password visibility">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="cu-err" id="cuConfirmErr"></span>
        </div>
      </div>

      <!-- ACCESS CONTROLS ───────────────────── -->
      <div class="cu-section">
        <div class="cu-section-title">Access Controls</div>

        <label class="cu-check-row">
          <input type="checkbox" class="cu-checkbox" id="cuForceChange" checked>
          <span class="cu-check-box"></span>
          <div class="cu-check-info">
            <span class="cu-check-label">Force password change on first login</span>
            <span class="cu-check-desc">User must set a personal password before accessing ContractIQ. Maps to <code class="cu-code">force_password_change = true</code> in the <code class="cu-code">users</code> table.</span>
          </div>
        </label>

        <div class="cu-divider"></div>

        <label class="cu-check-row">
          <input type="checkbox" class="cu-checkbox" id="cuIsActive" checked>
          <span class="cu-check-box"></span>
          <div class="cu-check-info">
            <span class="cu-check-label">Account is active</span>
            <span class="cu-check-desc">Inactive accounts cannot sign in. Maps to <code class="cu-code">is_active = true</code>.</span>
          </div>
        </label>

        <div class="cu-divider"></div>

        <label class="cu-check-row">
          <input type="checkbox" class="cu-checkbox" id="cuIsSuperuser">
          <span class="cu-check-box"></span>
          <div class="cu-check-info">
            <span class="cu-check-label">Grant superuser privileges</span>
            <span class="cu-check-desc">Superusers can create users, publish templates, and override approval routes. Maps to <code class="cu-code">is_superuser = true</code>.</span>
          </div>
        </label>
      </div>

      <!-- API error banner -->
      <div class="cu-api-error hidden" id="cuApiError">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="cuApiErrorText">An error occurred.</span>
      </div>

      <!-- Submit row -->
      <div class="cu-actions">
        <button class="btn-secondary" type="button" onclick="cuResetForm()">Clear form</button>
        <button class="btn-primary cu-submit" id="cuSubmitBtn" type="submit">
          <span id="cuSubmitLabel">Create User</span>
          <svg class="cu-spinner hidden" id="cuSpinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
        </button>
      </div>

    </form>
    <!-- Info panel is injected here by cuBuildInfoPanel() in app.js -->
  </div>

</div>
