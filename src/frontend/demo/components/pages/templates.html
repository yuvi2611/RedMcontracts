<div class="page-padding animate-in">
  <div class="page-header">
    <div>
      <h1 class="page-title">Template Library</h1>
      <p class="page-subtitle">Manage contract templates, placeholder sets, versions, and publishing status.</p>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn-secondary" onclick="showToast('Opening import dialog…','info')" type="button">Import .docx</button>
      <button class="btn-primary" onclick="showToast('New template editor coming soon.','info')" type="button">+ New Template</button>
    </div>
  </div>

  <!-- Coverage Summary -->
  <div class="template-coverage-bar animate-in animate-delay-1">
    <div class="tcov-item">
      <div class="tcov-num green" id="tcov-published">—</div>
      <div class="tcov-label">Published Templates</div>
    </div>
    <div class="tcov-item">
      <div class="tcov-num amber" id="tcov-draft">—</div>
      <div class="tcov-label">Draft Templates</div>
    </div>
    <div class="tcov-item">
      <div class="tcov-num blue" id="tcov-total">—</div>
      <div class="tcov-label">Total Templates</div>
    </div>
    <div class="tcov-item">
      <div class="tcov-num coal" id="tcov-generated">—</div>
      <div class="tcov-label">Contracts Generated</div>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-tabs animate-in animate-delay-2" style="margin-bottom:20px" id="templatesTabs">
    <button class="filter-tab active" onclick="filterTemplateCards(this,'all')">All <span class="tab-count">—</span></button>
    <button class="filter-tab" onclick="filterTemplateCards(this,'published')">Published <span class="tab-count">—</span></button>
    <button class="filter-tab" onclick="filterTemplateCards(this,'draft')">Draft <span class="tab-count">—</span></button>
  </div>

  <!-- Template Cards — populated by initTemplates() -->
  <div class="template-cards animate-in animate-delay-3" id="templateCards">
  </div>
</div>
